# Network Monitor - Host Configuration
# Add hosts here and restart the container, or use the dashboard UI.
#
# type: "ping"  - ICMP ping (default)
# type: "http"  - HTTP/HTTPS response check

hosts:
  - name: "Cloudflare DNS"
    host: "1.1.1.1"
    type: "ping"

  - name: "Google DNS"
    host: "8.8.8.8"
    type: "ping"

  - name: "Local Gateway"
    host: "192.168.1.1"
    type: "ping"

  - name: "Google"
    host: "https://www.google.com"
    type: "http"

  - name: "Cloudflare"
    host: "https://www.cloudflare.com"
    type: "http"
